<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Ultimate Hitboxes</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // GitHub Pages serves this for any URL that isn't a real file - e.g. a deep link
    // straight to a move page. It can't run the app directly (the built index.html uses
    // relative asset paths, which would resolve wrong at a nested URL like this one), so
    // instead it redirects to the site root with the real path packed into a query string;
    // index.html's own script then unpacks it and restores the URL via history.replaceState
    // before React Router ever looks at window.location.
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>

<body></body>

</html>
