name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout optimized frame images (assets-web branch)
        uses: actions/checkout@v4
        with:
          ref: assets-web
          path: ci-public-frames
      - name: Checkout character portraits and icons (assets branch)
        uses: actions/checkout@v4
        with:
          ref: assets
          path: ci-public-icons
          sparse-checkout: |
            characters
            icons
            series-symbol
          sparse-checkout-cone-mode: true
      - name: Merge frame/portrait/icon assets into public
        # Merge-copy rather than checking out directly into public/, since actions/checkout
        # cleans the target directory and would wipe the tracked public/nair.png favicon.
        run: |
          cp -r ci-public-frames/. public/ && rm -rf ci-public-frames
          cp -r ci-public-icons/. public/ && rm -rf ci-public-icons
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Add SPA GitHub Pages 404 fallback
        # Lives at 404.html rather than public/404.html because the asset merge steps above
        # write into public/ before this runs.
        run: cp 404.html dist/404.html && touch dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4