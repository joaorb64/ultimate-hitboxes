name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout optimized frame images (assets-web branch)
        uses: actions/checkout@v4
        with:
          ref: assets-web
          path: frontend/public
      - name: Checkout character portraits and icons (assets branch)
        uses: actions/checkout@v4
        with:
          ref: assets
          path: frontend/public-icons
          sparse-checkout: |
            characters
            icons
            series-symbol
          sparse-checkout-cone-mode: true
      - name: Merge portrait/icon assets into public
        run: cp -r frontend/public-icons/. frontend/public/ && rm -rf frontend/public-icons
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Preserve client-side routes
        working-directory: frontend
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4